[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pqdif"
version = "0.1.0a1"
description = "Native Python PQDIF reader and writer with lossless physical trees"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "licenses/*"]
authors = [{name = "pqdif contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
numpy = ["numpy>=1.24"]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.11", "mypy>=1.15", "build>=1.2", "twine>=6", "numpy>=1.24"]

[project.urls]
Repository = "https://github.com/ShietFak/pqdif"
Issues = "https://github.com/ShietFak/pqdif/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pqdif = ["py.typed", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = ["interop: independent Gemstone interoperability tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/pqdif"]

