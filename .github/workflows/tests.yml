name: Tests

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -m 'not interop'
      - run: python -m ruff check src tests tools examples
      - run: python -m ruff format --check src tests tools examples
      - run: python -m mypy src/pqdif
      - run: python -m build
      - run: python -m twine check dist/*

  gemstone:
    runs-on: ubuntu-latest
    env:
      PQDIF_REQUIRE_ORACLE: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: python -m pip install -e '.[dev]'
      - run: python tools/bootstrap_oracle.py
      - run: python -m pytest tests/interop -v

  wheel-core-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install build
      - run: python -m build
      - run: python -m venv work/smoke
      - run: work/smoke/bin/python -m pip install --no-deps dist/*.whl
      - run: work/smoke/bin/python -I tools/smoke_install.py --core-only
